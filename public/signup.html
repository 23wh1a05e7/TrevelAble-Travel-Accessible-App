<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - TravelAble</title>
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }

        html, body {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f4f4f4;
        }

        .signup-container {
            display: flex;
            width: 100%;
            min-height: 100vh;
        }

        .promo-section {
            flex: 1;
            position: relative;
            min-height: 100vh;
        }

        .promo-section img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .signup-form {
            flex: 1;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: white;
            text-align: center;
            overflow-y: auto;
        }

        .signup-form h2 {
            font-size: 28px;
            margin-bottom: 10px;
            color: #333;
        }

        .signup-form p {
            font-size: 16px;
            color: #777;
            margin-bottom: 20px;
        }

        .signup-form form {
            width: 85%;
            max-width: 400px;
        }

        .signup-form label {
            font-size: 14px;
            font-weight: bold;
            display: block;
            margin-top: 15px;
            text-align: left;
        }

        .signup-form input,
        .signup-form select {
            width: 100%;
            padding: 12px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }

        .signup-form input:focus,
        .signup-form select:focus {
            outline: none;
            border-color: #007BFF;
            box-shadow: 0 0 5px rgba(0, 123, 255, 0.3);
        }

        .checkbox-group {
            text-align: left;
            margin-top: 15px;
        }

        .checkbox-group label {
            display: flex;
            align-items: center;
            margin-top: 10px;
            font-weight: normal;
        }

        .checkbox-group input[type="checkbox"] {
            width: auto;
            margin-right: 8px;
            margin-top: 0;
        }

        .signup-form button {
            width: 100%;
            padding: 12px;
            background-color: #007BFF;
            color: white;
            font-size: 18px;
            border: none;
            border-radius: 5px;
            margin-top: 20px;
            cursor: pointer;
        }

        .signup-form button:hover {
            background-color: #0056b3;
        }

        .login-link {
            margin-top: 15px;
            font-size: 14px;
        }

        .login-link a {
            color: #007BFF;
            text-decoration: none;
            font-weight: bold;
        }

        .error-message {
            color: #d32f2f;
            font-size: 14px;
            margin-top: 10px;
            display: none;
        }

        .success-message {
            color: #388e3c;
            font-size: 14px;
            margin-top: 10px;
            display: none;
        }

        @media screen and (max-width: 900px) {
            .signup-container {
                flex-direction: column;
            }

            .promo-section {
                width: 100%;
                min-height: 30vh;
            }

            .signup-form {
                width: 100%;
                padding: 30px;
            }

            .signup-form form {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <div class="signup-container">
        <div class="promo-section">
            <img src="images/nature1.jpeg" alt="Travel Image">
        </div>

        <div class="signup-form">
            <h2>Create Account</h2>
            <p>Join TravelAble - Travel with confidence</p>

            <form id="signupForm">
                <label for="fullname">Full Name</label>
                <input type="text" id="fullname" placeholder="John Doe" required>

                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="example@gmail.com" required>

                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" placeholder="+91 98765 43210" required>

                <label for="password">Password</label>
                <input type="password" id="password" placeholder="At least 8 characters" required>

                <label for="confirm-password">Confirm Password</label>
                <input type="password" id="confirm-password" placeholder="Confirm your password" required>

                <label for="disability-type">Do you have any disability that requires assistance?</label>
                <select id="disability-type">
                    <option value="">Select disability type (Optional)</option>
                    <option value="mobility">Mobility Impairment</option>
                    <option value="visual">Visual Impairment</option>
                    <option value="hearing">Hearing Impairment</option>
                    <option value="cognitive">Cognitive Disability</option>
                    <option value="other">Other</option>
                </select>

                <label for="special-needs">Special Needs / Additional Information</label>
                <input type="text" id="special-needs" placeholder="e.g., wheelchair accessibility needed (Optional)">

                <div class="checkbox-group">
                    <label>
                        <input type="checkbox" id="agree-terms" required>
                        I agree to the Terms & Conditions
                    </label>
                </div>

                <div class="error-message" id="errorMessage"></div>
                <div class="success-message" id="successMessage"></div>

                <button type="submit">Create Account</button>
            </form>

            <p class="login-link">Already have an account? <a href="/login.html">Login here</a></p>
        </div>
    </div>

    <script>
        document.getElementById("signupForm").addEventListener("submit", function(event) {
            event.preventDefault();

            const fullname = document.getElementById("fullname").value;
            const email = document.getElementById("email").value;
            const phone = document.getElementById("phone").value;
            const password = document.getElementById("password").value;
            const confirmPassword = document.getElementById("confirm-password").value;
            const disabilityType = document.getElementById("disability-type").value;
            const specialNeeds = document.getElementById("special-needs").value;
            const agreeTerms = document.getElementById("agree-terms").checked;

            const errorMsg = document.getElementById("errorMessage");
            const successMsg = document.getElementById("successMessage");

            // Reset messages
            errorMsg.style.display = "none";
            successMsg.style.display = "none";

            // Validation
            if (password !== confirmPassword) {
                errorMsg.textContent = "Passwords do not match!";
                errorMsg.style.display = "block";
                return;
            }

            if (password.length < 8) {
                errorMsg.textContent = "Password must be at least 8 characters long!";
                errorMsg.style.display = "block";
                return;
            }

            if (!agreeTerms) {
                errorMsg.textContent = "Please agree to the Terms & Conditions!";
                errorMsg.style.display = "block";
                return;
            }

            // Call signup API
            fetch('/signup', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    fullname,
                    email,
                    phone,
                    password,
                    disability_type: disabilityType,
                    special_needs: specialNeeds
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    successMsg.textContent = "Account created successfully! Redirecting to login...";
                    successMsg.style.display = "block";
                    setTimeout(() => {
                        window.location.href = "/login.html";
                    }, 2000);
                } else {
                    errorMsg.textContent = data.message || "Signup failed. Please try again.";
                    errorMsg.style.display = "block";
                }
            })
            .catch(error => {
                console.error('Error:', error);
                errorMsg.textContent = "An error occurred. Please try again.";
                errorMsg.style.display = "block";
            });
        });
    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medical Assistant Request - TravelAble</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 16px;
            opacity: 0.9;
        }

        .form-wrapper {
            padding: 40px;
        }

        .form-section {
            margin-bottom: 30px;
        }

        .section-title {
            font-size: 20px;
            font-weight: bold;
            color: #333;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #667eea;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .form-row.full {
            grid-template-columns: 1fr;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
            font-size: 14px;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            font-family: 'Poppins', sans-serif;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 5px rgba(102, 126, 234, 0.3);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }

        .checkbox-group,
        .radio-group {
            margin-top: 10px;
        }

        .checkbox-group label,
        .radio-group label {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
            font-weight: normal;
            cursor: pointer;
        }

        .checkbox-group input[type="checkbox"],
        .radio-group input[type="radio"] {
            width: 18px;
            height: 18px;
            margin-right: 10px;
            cursor: pointer;
        }

        .required {
            color: #d32f2f;
        }

        .message {
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: none;
            font-weight: 500;
        }

        .error-message {
            background-color: #ffebee;
            color: #c62828;
            border-left: 4px solid #d32f2f;
        }

        .success-message {
            background-color: #e8f5e9;
            color: #2e7d32;
            border-left: 4px solid #4caf50;
        }

        .button-group {
            display: flex;
            gap: 15px;
            margin-top: 30px;
            justify-content: center;
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-submit {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            min-width: 150px;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-cancel {
            background: #f0f0f0;
            color: #333;
            min-width: 150px;
        }

        .btn-cancel:hover {
            background: #e0e0e0;
        }

        .info-box {
            background: #e3f2fd;
            border-left: 4px solid #2196f3;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            color: #1565c0;
        }

        .info-box i {
            margin-right: 10px;
        }

        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
                gap: 15px;
            }

            .form-wrapper {
                padding: 25px;
            }

            .header h1 {
                font-size: 24px;
            }

            .button-group {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <i class="fas fa-medkit" style="font-size: 40px; margin-bottom: 10px;"></i>
            <h1>Medical Assistant Request</h1>
            <p>Book a medical assistant for your journey</p>
        </div>

        <div class="form-wrapper">
            <div id="errorMessage" class="message error-message"></div>
            <div id="successMessage" class="message success-message"></div>

            <div class="info-box">
                <i class="fas fa-info-circle"></i>
                <strong>Important:</strong> Please provide accurate details so we can arrange the best medical assistance for your needs.
            </div>

            <form id="medicalForm">
                <!-- Traveler Information -->
                <div class="form-section">
                    <h2 class="section-title">Traveler Information</h2>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="travelerName">Full Name <span class="required">*</span></label>
                            <input type="text" id="travelerName" name="travelerName" placeholder="John Doe" required>
                        </div>
                        <div class="form-group">
                            <label for="email">Email Address <span class="required">*</span></label>
                            <input type="email" id="email" name="email" placeholder="john@example.com" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="phone">Phone Number <span class="required">*</span></label>
                            <input type="tel" id="phone" name="phone" placeholder="+91 98765 43210" required>
                        </div>
                        <div class="form-group">
                            <label for="age">Age <span class="required">*</span></label>
                            <input type="number" id="age" name="age" min="1" max="120" required>
                        </div>
                    </div>
                </div>

                <!-- Travel Information -->
                <div class="form-section">
                    <h2 class="section-title">Travel Details</h2>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="travelFrom">Traveling From <span class="required">*</span></label>
                            <input type="text" id="travelFrom" name="travelFrom" placeholder="e.g., Delhi" required>
                        </div>
                        <div class="form-group">
                            <label for="travelTo">Traveling To <span class="required">*</span></label>
                            <input type="text" id="travelTo" name="travelTo" placeholder="e.g., Mumbai" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="travelDate">Travel Date <span class="required">*</span></label>
                            <input type="date" id="travelDate" name="travelDate" required>
                        </div>
                        <div class="form-group">
                            <label for="transportMode">Mode of Transport <span class="required">*</span></label>
                            <select id="transportMode" name="transportMode" required>
                                <option value="">Select transport mode</option>
                                <option value="flight">Flight</option>
                                <option value="train">Train</option>
                                <option value="bus">Bus</option>
                                <option value="car">Car/Taxi</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row full">
                        <div class="form-group">
                            <label for="journeyDuration">Journey Duration (Estimated hours) <span class="required">*</span></label>
                            <input type="number" id="journeyDuration" name="journeyDuration" min="1" placeholder="e.g., 8" required>
                        </div>
                    </div>
                </div>

                <!-- Medical Information -->
                <div class="form-section">
                    <h2 class="section-title">Medical Information</h2>

                    <div class="form-row full">
                        <div class="form-group">
                            <label>Type of Disability/Medical Condition <span class="required">*</span></label>
                            <div class="checkbox-group">
                                <label>
                                    <input type="checkbox" name="disabilityType" value="mobility"> Mobility Impairment (Wheelchair/Crutches)
                                </label>
                                <label>
                                    <input type="checkbox" name="disabilityType" value="visual"> Visual Impairment
                                </label>
                                <label>
                                    <input type="checkbox" name="disabilityType" value="hearing"> Hearing Impairment
                                </label>
                                <label>
                                    <input type="checkbox" name="disabilityType" value="cognitive"> Cognitive Disability
                                </label>
                                <label>
                                    <input type="checkbox" name="disabilityType" value="chronic"> Chronic Medical Condition
                                </label>
                                <label>
                                    <input type="checkbox" name="disabilityType" value="other"> Other
                                </label>
                            </div>
                        </div>
                    </div>

                    <div class="form-row full">
                        <div class="form-group">
                            <label for="medicalDetails">Detailed Medical Condition Description <span class="required">*</span></label>
                            <textarea id="medicalDetails" name="medicalDetails" placeholder="Please describe your medical condition, medications, allergies, or any special requirements..." required></textarea>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="medications">Current Medications (if any)</label>
                            <input type="text" id="medications" name="medications" placeholder="e.g., Insulin, Blood Pressure medications">
                        </div>
                        <div class="form-group">
                            <label for="allergies">Known Allergies (if any)</label>
                            <input type="text" id="allergies" name="allergies" placeholder="e.g., Penicillin, Peanuts">
                        </div>
                    </div>
                </div>

                <!-- Assistant Requirements -->
                <div class="form-section">
                    <h2 class="section-title">Medical Assistant Requirements</h2>

                    <div class="form-row full">
                        <div class="form-group">
                            <label>Type of Assistance Needed <span class="required">*</span></label>
                            <div class="checkbox-group">
                                <label>
                                    <input type="checkbox" name="assistanceType" value="mobility_help"> Mobility Assistance
                                </label>
                                <label>
                                    <input type="checkbox" name="assistanceType" value="medication_management"> Medication Management
                                </label>
                                <label>
                                    <input type="checkbox" name="assistanceType" value="personal_care"> Personal Care Assistance
                                </label>
                                <label>
                                    <input type="checkbox" name="assistanceType" value="communication_support"> Communication Support
                                </label>
                                <label>
                                    <input type="checkbox" name="assistanceType" value="emergency_support"> Emergency Support
                                </label>
                                <label>
                                    <input type="checkbox" name="assistanceType" value="medical_monitoring"> Medical Monitoring
                                </label>
                            </div>
                        </div>
                    </div>

                    <div class="form-row full">
                        <div class="form-group">
                            <label for="specialRequirements">Special Requirements or Preferences</label>
                            <textarea id="specialRequirements" name="specialRequirements" placeholder="e.g., Language preference, specific medical equipment needed, dietary restrictions..."></textarea>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="budget">Budget (Optional - in your currency)</label>
                            <input type="number" id="budget" name="budget" placeholder="e.g., 5000">
                        </div>
                        <div class="form-group">
                            <label for="assistantGender">Preferred Assistant Gender (Optional)</label>
                            <select id="assistantGender" name="assistantGender">
                                <option value="">No preference</option>
                                <option value="male">Male</option>
                                <option value="female">Female</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Emergency Contact -->
                <div class="form-section">
                    <h2 class="section-title">Emergency Contact</h2>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="emergencyName">Emergency Contact Name <span class="required">*</span></label>
                            <input type="text" id="emergencyName" name="emergencyName" placeholder="Relative or Friend's Name" required>
                        </div>
                        <div class="form-group">
                            <label for="emergencyPhone">Emergency Contact Phone <span class="required">*</span></label>
                            <input type="tel" id="emergencyPhone" name="emergencyPhone" placeholder="+91 98765 43210" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="emergencyRelation">Relationship</label>
                            <input type="text" id="emergencyRelation" name="emergencyRelation" placeholder="e.g., Son, Daughter, Friend">
                        </div>
                    </div>
                </div>

                <!-- Terms and Submit -->
                <div class="form-section">
                    <div class="form-row full">
                        <div class="form-group">
                            <div class="checkbox-group">
                                <label>
                                    <input type="checkbox" id="agreeTerms" required>
                                    I confirm all information provided is accurate and I agree to TravelAble's medical assistance terms
                                </label>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="button-group">
                    <button type="reset" class="btn btn-cancel">Clear Form</button>
                    <button type="submit" class="btn btn-submit">
                        <i class="fas fa-check-circle" style="margin-right: 8px;"></i>Submit Request
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        document.getElementById("medicalForm").addEventListener("submit", function(event) {
            event.preventDefault();

            const errorMsg = document.getElementById("errorMessage");
            const successMsg = document.getElementById("successMessage");

            // Reset messages
            errorMsg.style.display = "none";
            successMsg.style.display = "none";

            // Collect checkbox values
            const disabilityTypes = Array.from(document.querySelectorAll('input[name="disabilityType"]:checked')).map(x => x.value);
            const assistanceTypes = Array.from(document.querySelectorAll('input[name="assistanceType"]:checked')).map(x => x.value);

            if (disabilityTypes.length === 0) {
                errorMsg.textContent = "Please select at least one disability/medical condition type.";
                errorMsg.style.display = "block";
                return;
            }

            if (assistanceTypes.length === 0) {
                errorMsg.textContent = "Please select at least one type of assistance needed.";
                errorMsg.style.display = "block";
                return;
            }

            // Prepare form data
            const formData = {
                traveler_name: document.getElementById("travelerName").value,
                email: document.getElementById("email").value,
                phone: document.getElementById("phone").value,
                age: document.getElementById("age").value,
                travel_from: document.getElementById("travelFrom").value,
                travel_to: document.getElementById("travelTo").value,
                travel_date: document.getElementById("travelDate").value,
                transport_mode: document.getElementById("transportMode").value,
                journey_duration: document.getElementById("journeyDuration").value,
                disability_types: disabilityTypes.join(", "),
                medical_details: document.getElementById("medicalDetails").value,
                medications: document.getElementById("medications").value,
                allergies: document.getElementById("allergies").value,
                assistance_types: assistanceTypes.join(", "),
                special_requirements: document.getElementById("specialRequirements").value,
                budget: document.getElementById("budget").value,
                assistant_gender: document.getElementById("assistantGender").value,
                emergency_name: document.getElementById("emergencyName").value,
                emergency_phone: document.getElementById("emergencyPhone").value,
                emergency_relation: document.getElementById("emergencyRelation").value
            };

            // Call API
            fetch('/medical-assistant-request', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(formData)
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    successMsg.textContent = "Request submitted successfully! Our team will contact you soon. Request ID: " + (data.request_id || "N/A");
                    successMsg.style.display = "block";
                    document.getElementById("medicalForm").reset();
                    setTimeout(() => {
                        window.location.href = "/main.html";
                    }, 3000);
                } else {
                    errorMsg.textContent = data.message || "Failed to submit request. Please try again.";
                    errorMsg.style.display = "block";
                }
            })
            .catch(error => {
                console.error('Error:', error);
                errorMsg.textContent = "An error occurred. Please try again.";
                errorMsg.style.display = "block";
            });
        });
    </script>

</body>
</html>
